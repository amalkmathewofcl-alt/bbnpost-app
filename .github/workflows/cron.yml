name: Hourly News Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# This block gives the action permission to push last_post.json back to the repo
permissions:
  contents: write

jobs:
  check-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install dependencies (like firebase-admin) so the script can run
      - name: Install Dependencies
        run: npm install

      # Run the script and pass the Firebase Secret securely
      - name: Run notification script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.js

      - name: Commit last_post.json
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add last_post.json
          # Only commit if last_post.json actually changed
          if ! git diff --staged --quiet; then
            git commit -m "Update last post ID"
            git push
          else
            echo "No new posts, skipping commit."
          fi